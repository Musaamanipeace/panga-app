# Free Supabase projects pause after about a week without activity.
# This pings the API twice a week so the project stays awake.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret not set"; exit 1; }
          curl -fsS "$SUPABASE_URL/rest/v1/panga_records?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" >/dev/null
